e: #A80036; stroke-width: 1.0;" x1="103.8" x2="111.8" y1="204" y2="204"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="62" x="116.75" y="197.5684">hasTarget</text><!--link Annotation to TextualBody--><path d="M252,236.14 C252,251.57 252,270.33 252,286.54 " fill="none" id="Annotation-TextualBody" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="252,299.99,256,290.99,252,294.99,248,290.99,252,299.99" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="252" x2="252" y1="294.99" y2="286.99"/><polygon fill="#A80036" points="252,223.07,248,229.07,252,235.07,256,229.07,252,223.07" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="52" x="253" y="266.5684">hasBody</text><!--link HTMLFile to TextualBody--><path d="M127.25,325 C137.27,325 147.29,325 157.3,325 " fill="none" id="HTMLFile-TextualBody" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="122.02,325,131.02,329,127.02,325,131.02,321,122.02,325" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml
object PoolReport {
    title: {email subject header}
}
object Body {
    title: Body
}
object Attachment {
    title: Attachment {n}
}
object HTMLFile {
    mimetype : text/html
}
object File
object Annotation {
    motivation: painting
}
object TextualBody {
    mimetype: text/plain
    value: {text content of the HTMLFile}
}

PoolReport *- - -> Body : hasMember
PoolReport *- - -> "n = 0..*" Attachment : hasMember

Body *- -> HTMLFile : hasFile
Attachment *- -> File : hasFile

Body <-o Annotation : hasTarget
Annotation *- -> TextualBody : hasBody

HTMLFile <. TextualBody
@enduml

